name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever reads the repository. Without this block the
# workflow inherits whatever the repository default is, which can include write
# access — an unnecessary blast radius for a job that runs code from pull requests.
permissions:
  contents: read

# No workflow-level XCODE_PATH here, unlike release.yml. This file runs two
# toolchains, so a runner and its Xcode are one pair per matrix entry rather than
# one value for the whole file — which is what "runner and Xcode must agree" was
# always asking for. `release.yml` keeps the workflow-level variable, because all
# four of its jobs are macos-26.

jobs:
  test:
    name: 🧪 ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    # The preview entry cannot fail the workflow. It is here to compile a layout CI
    # could not reach before, not to gate a merge on an image whose own announcement
    # warns that software may be unstable and that capacity is still being balanced.
    continue-on-error: ${{ matrix.preview }}

    strategy:
      # Without this, the release toolchain failing would cancel the preview entry —
      # and the moment the two toolchains disagree is exactly when one of them fails.
      fail-fast: false
      matrix:
        include:
          # `toolchain` drives both the Xcode path and the cache key, so those two
          # cannot drift apart.
          - name: Test & Build — Xcode 26.6
            runner: macos-26
            toolchain: "26.6"
            preview: false

          # Swift 6.4 on macOS 27: the SPM output layout the release toolchain does
          # not produce, and which no CI run compiled until this entry existed. Read
          # CLAUDE.md before moving the release onto it — `xcode-27` is a preview
          # image.
          - name: Test & Build — Xcode 27.1 (preview)
            runner: xcode-27
            toolchain: "27.1"
            preview: true

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.toolchain }}.app

      # The toolchain belongs in the key, not as decoration: Swift ≤6.3 writes
      # modules to `.build/release/Modules` while 6.4 turns `.build/release` into a
      # symlink to `.build/out/Products/Release`. `runner.os` is `macOS` on both
      # runners, so a key without the toolchain would hand each entry the other's
      # layout and produce a failure that has nothing to do with the commit.
      - name: 📦 Restore SPM cache
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: 🔢 Check version consistency
        run: make version-check

      # Runs before the build so a formatting-only PR fails in seconds
      # rather than after a full compile.
      - name: 🎨 Check formatting
        run: make lint

      # `make coverage` runs the same suite as `swift test`, with instrumentation.
      # One step instead of two so the suite is not compiled and run twice.
      #
      # `shell: bash` is required, not cosmetic: the default runner shell is
      # `bash -e` without pipefail, so piping into tee would mask a failing
      # test run behind tee's exit code.
      - name: 🧪 Run tests with coverage
        shell: bash
        run: make coverage | tee coverage.txt

      # Surfaces the table on the run's summary page, so reviewers see the
      # numbers without opening the log. Runs even on failure, but only if the
      # report was actually produced.
      - name: 📊 Coverage summary
        if: always()
        shell: bash
        run: |
          if [ ! -s coverage.txt ]; then
            echo "No coverage report produced — skipping summary."
            exit 0
          fi
          {
            echo '### 📊 Code coverage — SmartDockCore (Xcode ${{ matrix.toolchain }})'
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
            echo ''
            echo '_The `SmartDock` executable target is not linked into the test bundle, so it does not appear here._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔨 Build release
        run: swift build -c release

      # Exercises the parts `swift build` never touches: icon generation,
      # App Intents metadata, entitlements and ad-hoc codesigning. Without this
      # they are only ever run at release time, so a break surfaces mid-release
      # instead of on the PR.
      #
      # The App Intents step matters most here. Its metadata is built from two
      # undocumented Xcode flags, and if a toolchain drops them the intents still
      # compile and link — they just vanish from Shortcuts. `make app` runs
      # `appintents-check`, which turns that into a failed build. It also runs
      # `entitlements-check` (the sealed bundle carries exactly the entitlements
      # file — without apple-events the app cannot touch the Dock) and
      # `sdef-check` (every scripting class the dictionary names exists).
      - name: 📦 Build .app bundle
        run: make app

      # The entitlements are printed for the log; asserting them is `make app`'s job.
      - name: 🔏 Verify bundle signature
        run: |
          codesign --verify --strict --verbose=2 build/SmartDock.app
          codesign --display --entitlements - build/SmartDock.app
