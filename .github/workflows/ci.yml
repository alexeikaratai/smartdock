name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.6.app

jobs:
  test:
    name: 🧪 Test & Build
    runs-on: macos-26

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s ${{ env.XCODE_PATH }}

      - name: 📦 Restore SPM cache
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 🧪 Run tests
        run: swift test

      - name: 🔨 Build release
        run: swift build -c release
