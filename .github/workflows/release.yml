name: Release

on:
  push:
    tags:
      - 'v*'

# Read by default, write only where it is used. Three of the four jobs never touch
# GITHUB_TOKEN at all: Test and Build only check out, and Homebrew reaches the tap
# over its own deploy key and the release assets over public URLs.
permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_26.6.app

jobs:

  # ── Stage 1: Test ────────────────────────────────────────

  test:
    name: 🧪 Test
    runs-on: macos-26

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s ${{ env.XCODE_PATH }}

      - name: 📦 Restore SPM cache
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 🧪 Run tests
        run: swift test

  # ── Stage 2: Build ───────────────────────────────────────

  build:
    name: 🔨 Build
    runs-on: macos-26
    needs: test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s ${{ env.XCODE_PATH }}

      - name: 📦 Restore SPM cache
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 🏷️ Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 📌 Update version in project files
        # Delegates to `make bump` so the list of files carrying the version lives
        # in exactly one place. It self-verifies via `make version-check` and fails
        # the build if any reference is left stale.
        run: make bump V=${{ steps.version.outputs.VERSION }}

      - name: 📝 Verify release notes
        # The same target `make release` uses. Run after `bump`, which is what puts
        # the CHANGELOG into the shape that ships: before it the section for this
        # tag does not exist yet. 2.8.1 was published with an empty body because
        # nothing on this path checked.
        run: make changelog-check

      - name: 📄 Collect release notes
        # Written here rather than in the release job, which has no checkout — and
        # could not produce them anyway: the section for this tag only exists after
        # `bump` runs, which happens in this job's working copy.
        #
        # `build/` is created here rather than relied upon: `make app` makes it later,
        # and a developer's machine always has one left over from the last build, so
        # the missing directory only showed up on a clean runner.
        run: |
          mkdir -p build
          make release-notes > build/notes.md

      - name: 🔨 Build app bundle
        run: make app

      - name: 📦 Create release zip
        run: cd build && zip -r SmartDock-${{ steps.version.outputs.VERSION }}.zip SmartDock.app

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmartDock-${{ steps.version.outputs.VERSION }}
          # Both live under build/, so the download puts them side by side.
          path: |
            build/SmartDock-${{ steps.version.outputs.VERSION }}.zip
            build/notes.md

  # ── Stage 3: GitHub Release ──────────────────────────────

  release:
    name: 🎉 Release
    runs-on: macos-26
    needs: build

    # The one job that uses the token, and the only one raised above the workflow's
    # read default: `gh release` writes. Downloading the artifact needs nothing — a
    # same-run download is scoped to its own run and takes no `github-token`, which
    # the action requires only for another run or another repository.
    permissions:
      contents: write

    steps:
      - name: 🏷️ Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v8
        with:
          name: SmartDock-${{ steps.version.outputs.VERSION }}

      - name: 🎉 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG=${{ github.ref_name }}
          ZIP=SmartDock-${VERSION}.zip

          # The body is this version's CHANGELOG section. `--generate-notes` used to
          # stand in for it and produced a bare compare link — 2.8.1 shipped that way.
          if gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release exists — uploading asset and refreshing notes"
            gh release upload "${TAG}" "${ZIP}" --clobber --repo "${{ github.repository }}"
            gh release edit "${TAG}" --repo "${{ github.repository }}" --notes-file notes.md
          else
            gh release create "${TAG}" "${ZIP}" \
              --repo "${{ github.repository }}" \
              --title "SmartDock ${VERSION}" \
              --notes-file notes.md
          fi

  # ── Stage 4: Homebrew Tap ────────────────────────────────

  homebrew:
    name: 🍺 Homebrew
    runs-on: macos-26
    needs: release

    steps:
      - name: 🏷️ Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: 🍺 Update Homebrew tap
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          REPO=${{ github.repository }}
          ZIP_URL="https://github.com/${REPO}/releases/download/v${VERSION}/SmartDock-${VERSION}.zip"
          TAR_URL="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"

          # Download, then hash what landed.
          #
          # `curl -sL` without -f was here, piped straight into shasum. On a 404
          # curl writes GitHub's 9-byte "Not Found" page to stdout and exits **0**,
          # so the tap would take the hash of that page —
          # 0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5 —
          # and every `brew install` and `brew upgrade` would fail for everyone.
          # Measured on a missing asset, not assumed. The pipe hid it twice over:
          # this step sets no pipefail, so even a non-zero curl was swallowed.
          #
          # The `sleep 10` that stood in for waiting goes with it. GitHub can take
          # longer than ten seconds to serve an asset it has just accepted, and a
          # fixed wait either guesses right or publishes a broken tap; retries wait
          # only as long as they have to, and give up loudly.
          curl -fsSL --retry 10 --retry-delay 3 --retry-all-errors -o release.zip "${ZIP_URL}"
          curl -fsSL --retry 10 --retry-delay 3 --retry-all-errors -o source.tar.gz "${TAR_URL}"
          ZIP_SHA=$(shasum -a 256 release.zip | cut -d' ' -f1)
          TAR_SHA=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)
          echo "Cask SHA256:    ${ZIP_SHA}"
          echo "Formula SHA256: ${TAR_SHA}"

          # Clone tap repo
          git clone git@github.com:alexeikaratai/homebrew-tap.git /tmp/tap
          cd /tmp/tap

          # Update Cask
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/smartdock.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${ZIP_SHA}\"/" Casks/smartdock.rb

          # Update Formula — rewrite the whole url line rather than matching a
          # version pattern inside it, which cannot drift as the url changes shape.
          sed -i '' "s|^  url \".*\"|  url \"${TAR_URL}\"|" Formula/smartdock.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${TAR_SHA}\"/" Formula/smartdock.rb

          # A sed that matches nothing is silent. The old Formula pattern required a
          # trailing slash the tarball url never had, so the url stayed at v1.2.1
          # while its sha256 tracked every release — the Formula could not install at
          # all. Fail the release rather than publish a broken tap again.
          for check in \
            "Formula/smartdock.rb:v${VERSION}.tar.gz" \
            "Formula/smartdock.rb:${TAR_SHA}" \
            "Casks/smartdock.rb:version \"${VERSION}\"" \
            "Casks/smartdock.rb:${ZIP_SHA}"; do
            file="${check%%:*}"
            needle="${check#*:}"
            grep -qF "${needle}" "${file}" || {
              echo "::error::${file} was not updated — expected to find: ${needle}"
              exit 1
            }
          done

          # Commit & push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update SmartDock to v${VERSION}"
          git push
